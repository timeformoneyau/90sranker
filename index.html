<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shelf Life</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&family=Passion+One:wght@400;700;900&family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="user-bar">
    <div id="user-indicator" class="user-indicator"></div>
  </div>
  <div class="bg-overlay"></div>

  <!-- Header -->
  <header class="site-header">
    <!-- Membership Card -->
    <div class="member-card">
      <div class="member-card-inner">
        <div class="member-card-avatar"></div>
        <div class="member-card-details">
          <div class="member-card-label">Official Membership</div>
          <div class="member-card-brand">SHELF LIFE</div>
          <div class="member-card-tier">Gold Tier Member</div>
          <div class="member-card-name" id="member-name">GUEST</div>
        </div>
      </div>
      <div class="member-card-barcode">*SL-1995-0422*</div>
      <div class="member-card-footer">
        <span class="member-card-exp">EXP 12/99</span>
        <button class="member-card-logout" id="member-logout" style="display:none">Log Out</button>
      </div>
    </div>

    <div class="site-title">SHELF LIFE</div>
    <p class="site-subtitle">Ranking the 90's, one movie at a time.</p>
  </header>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="list.html">Results</a></li>
      <li><a href="mikes-picks.html">Mike's Picks</a></li>
      <li><a href="engine.html">Engine</a></li>
      <li><a href="unseen.html">Haven't Seen</a></li>
      <li><a href="account.html">Your Account</a></li>
      <li id="admin-nav-link" style="display:none"><a href="coverage.html">Admin</a></li>
    </ul>
    <div id="login-status"></div>
  </nav>

  <div class="container">
    <!-- Compare Section -->
    <section id="compare-section">

      <!-- Movie A -->
      <div class="movie-block" id="movieA-block">
        <div class="confetti-container" id="confetti-container-a"></div>
        <img src="" alt="Movie Poster A" id="posterA" class="poster" onclick="vote('A')" />
        <div class="movie-title" id="movieA">Movie A</div>
        <div class="movie-year" id="movieA-year"></div>
        <button class="btn-rent" onclick="vote('A')">Rent</button>
        <button class="btn-unseen" onclick="markUnseen(movieA)">Haven't Seen</button>
        <button class="btn-info" onclick="showMovieInfo('A')" title="Movie Info">ⓘ</button>
      </div>

      <!-- Or Separator -->
      <div class="or-separator">or</div>

      <!-- Movie B -->
      <div class="movie-block" id="movieB-block">
        <div class="confetti-container" id="confetti-container-b"></div>
        <img src="" alt="Movie Poster B" id="posterB" class="poster" onclick="vote('B')" />
        <div class="movie-title" id="movieB">Movie B</div>
        <div class="movie-year" id="movieB-year"></div>
        <button class="btn-rent" onclick="vote('B')">Rent</button>
        <button class="btn-unseen" onclick="markUnseen(movieB)">Haven't Seen</button>
        <button class="btn-info" onclick="showMovieInfo('B')" title="Movie Info">ⓘ</button>
      </div>

    </section>

    <!-- Shelf Ledge -->
    <div class="shelf-ledge"></div>

    <!-- Movie Info Modal -->
    <div id="movie-info-modal" class="info-modal-backdrop hidden">
      <div class="info-modal">
        <div class="info-modal-header">
          <h3 class="info-modal-title" id="info-modal-title"></h3>
          <button class="info-modal-close" onclick="closeMovieInfo()">&times;</button>
        </div>
        <div class="info-modal-body" id="info-modal-body">
          <div class="info-modal-loading">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Vote Counter -->
    <div class="vote-counter">
      <div class="vote-counter-value" id="home-vote-count">0</div>
      <div class="vote-counter-sub">Total Rentals</div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="auth.js"></script>
  <script type="module" src="ranker.js"></script>
  <script type="module" src="loginStatus.js"></script>
</body>
</html>
